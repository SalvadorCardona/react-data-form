name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs wait rather than cancel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: react-data-form

      # The site imports the library from source, so the sibling packages must
      # be resolvable. Once they are published to npm, these steps can go.
      - uses: actions/checkout@v4
        with:
          repository: SalvadorCardona/react-mini-i18n
          path: react-mini-i18n

      - uses: actions/checkout@v4
        with:
          repository: SalvadorCardona/jsonld-item
          path: jsonld-item

      - uses: actions/checkout@v4
        with:
          repository: SalvadorCardona/resource-registry
          path: resource-registry

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: react-data-form/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: react-data-form/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: jsonld-item
      - run: pnpm run build
        working-directory: jsonld-item

      - run: pnpm install --frozen-lockfile
        working-directory: react-mini-i18n
      - run: pnpm run build
        working-directory: react-mini-i18n

      - run: pnpm install --frozen-lockfile
        working-directory: resource-registry
      - run: pnpm run build
        working-directory: resource-registry

      - run: pnpm install --frozen-lockfile
        working-directory: react-data-form

      # Pages serves the site from /<repository>/, not from the domain root.
      - run: pnpm run docs:build
        working-directory: react-data-form
        env:
          DOCS_BASE: /react-data-form/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: react-data-form/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
