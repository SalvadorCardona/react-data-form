name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: react-data-form

      # See the comment in ci.yml: links to the sibling repositories until they
      # are published to npm.
      - uses: actions/checkout@v4
        with:
          repository: SalvadorCardona/react-mini-i18n
          path: react-mini-i18n
          token: ${{ secrets.DEPS_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: SalvadorCardona/jsonld-item
          path: jsonld-item
          token: ${{ secrets.DEPS_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: SalvadorCardona/resource-registry
          path: resource-registry
          token: ${{ secrets.DEPS_TOKEN || github.token }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: react-data-form/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: react-data-form/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      # The linked packages must be built for their type declarations to resolve
      - run: pnpm install --frozen-lockfile
        working-directory: jsonld-item
      - run: pnpm run build
        working-directory: jsonld-item

      - run: pnpm install --frozen-lockfile
        working-directory: react-mini-i18n
      - run: pnpm run build
        working-directory: react-mini-i18n

      - run: pnpm install --frozen-lockfile
        working-directory: resource-registry
      - run: pnpm run build
        working-directory: resource-registry

      - run: pnpm install --frozen-lockfile
        working-directory: react-data-form

      # Opens (or updates) the "Version Packages" pull request.
      # Once that PR is merged, this same step publishes to npm.
      - uses: changesets/action@v1
        with:
          cwd: react-data-form
          version: pnpm changeset version
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
